name: agent

# Times are UTC. Spain is +2 in summer, +1 in winter.
on:
  schedule:
    - cron: "*/15 * * * *"      # watch the market
    - cron: "20 22 * * *"       # 00:20 Madrid, right after the daily value refresh
    - cron: "30-59/5 15 * * *"  # dense band around 17:48 Madrid, when clauses open
    - cron: "0 6 * * *"         # 08:00 Madrid, the daily brief
  workflow_dispatch:
    inputs:
      brief:
        description: Send the daily brief
        type: boolean
        default: false
      dry_run:
        description: Plan and ask, but never call the API
        type: boolean
        default: false
  repository_dispatch:
    types: [run-agent]
  push:
    branches: [main]
    paths: ["policy.yml", "intel/roles.yml"]

# One run at a time. Two overlapping runs would race on the state commit and,
# worse, could pay the same clause twice.
concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FANTASY_EMAIL: ${{ secrets.FANTASY_EMAIL }}
      FANTASY_PASSWORD: ${{ secrets.FANTASY_PASSWORD }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Read replies
        run: fantasy poll

      - name: Run the loop
        run: fantasy run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Daily brief
        if: github.event.schedule == '0 6 * * *' || inputs.brief
        run: fantasy brief

      - name: Commit state
        run: |
          git config user.name  "fantasy-agent"
          git config user.email "actions@github.com"
          git add state
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
