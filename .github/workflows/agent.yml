name: agent

# The decision half. Every firing is anchored to something that actually
# happens in the game rather than to a round number on a clock, which is why
# there is no blanket poll here any more: a clause opens fourteen days after
# its owner signed the player, so the agent knows about every window days in
# advance and has no reason to go looking every quarter of an hour.
#
# Times are UTC. Spain is +2 until late October and +1 after, so each entry
# drifts an hour in winter; the jobs are scheduled with an hour of slack rather
# than being cut fine, and the code reads the real deadline from the API.

on:
  schedule:
    # 00:20 Madrid — straight after the nightly revaluation. The one job that
    # must not be missed: prices, roles and the league snapshot all refresh.
    - cron: "20 22 * * *"
    # 08:00 Madrid — the morning read, on the way to work.
    - cron: "0 6 * * *"
    # 15:45 Madrid — about two hours before the daily market closes, while
    # there is still time to act on what it finds.
    - cron: "45 13 * * *"
    # 17:40-18:00 Madrid, every five minutes — clause windows open at 17:48 and
    # GitHub's scheduler is habitually late, so this band is deliberately dense.
    - cron: "40-59/5 15 * * *"
  workflow_dispatch:
    inputs:
      brief:
        description: Send the daily brief
        type: boolean
        default: false
      dry_run:
        description: Plan and ask, but never call the API
        type: boolean
        default: false
  repository_dispatch:
    types: [run-agent]
  push:
    branches: [main]
    paths: ["config/policy.yml", "config/roles.yml"]

# One at a time. Two overlapping runs would race on the state commit and, far
# worse, could pay the same clause twice.
concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FANTASY_EMAIL: ${{ secrets.FANTASY_EMAIL }}
      FANTASY_PASSWORD: ${{ secrets.FANTASY_PASSWORD }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: The loop — perceive, plan, revalidate, ask, execute
        run: fantasy run ${{ inputs.dry_run && '--dry-run' || '' }}

      # Only after the nightly revaluation: re-reading 144 price histories is
      # pointless until the numbers have actually changed.
      - name: Refresh price histories
        if: github.event.schedule == '20 22 * * *'
        run: fantasy values

      - name: Judgment on today's candidates
        if: github.event.schedule == '0 6 * * *' || github.event.schedule == '45 13 * * *'
        run: fantasy advise --send

      - name: Daily brief
        if: inputs.brief
        run: fantasy brief

      - name: Save the state
        run: |
          git config user.name  "fantasy-agent"
          git config user.email "actions@github.com"
          git add state
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
