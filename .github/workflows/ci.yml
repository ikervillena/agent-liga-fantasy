name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["state/**"]   # the agent's own commits are data, not code
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests
        run: pytest --cov=fantasy_agent --cov-report=term-missing
