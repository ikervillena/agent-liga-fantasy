name: chat

# The conversational half. Kept separate from `agent` on purpose: this one has
# to be frequent and cheap, and the decision jobs have to be slow and careful.
# Mixing them would force one cadence on both.
#
# Five minutes is the shortest interval GitHub schedules, and in practice it
# fires late and unevenly — fine here, because nothing in this workflow is
# time-critical. It reads the channel, answers whatever was asked, and applies
# any button that was pressed.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never two at once: both copies would read the same updates from Telegram and
# answer the same question twice.
concurrency:
  group: chat
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FANTASY_EMAIL: ${{ secrets.FANTASY_EMAIL }}
      FANTASY_PASSWORD: ${{ secrets.FANTASY_PASSWORD }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Read the channel and answer
        run: fantasy poll

      - name: Save the cursor
        run: |
          git config user.name  "fantasy-agent"
          git config user.email "actions@github.com"
          git add state
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "chat: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
