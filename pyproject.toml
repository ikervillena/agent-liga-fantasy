[project]
name = "fantasy-agent"
version = "0.2.0"
description = "An agent that manages a LaLiga Fantasy squad under an explicit, human-approved policy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Iker Villena" }]

dependencies = [
    "anthropic>=0.40",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "types-PyYAML",
]

[project.scripts]
fantasy = "fantasy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "TID"]
# ANN101/102 are deprecated; self and cls need no annotation.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests may leave return types implicit and use assert freely.
"tests/**" = ["ANN201", "ANN001"]

[tool.ruff.lint.flake8-tidy-imports]
# The domain must never import an adapter. Enforced, not just documented.
banned-module-level-imports = []

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "selectolax.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "network: hits a real external service; deselected by default in CI",
    "llm: calls the Anthropic API and therefore costs money",
]

[tool.coverage.run]
source = ["src/fantasy"]
branch = true

[tool.coverage.report]
# The domain is where money is lost, so the bar is high and enforced.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
